services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_* are baked into the frontend bundle at build time (from the root .env).
        VITE_MCP_BASE_URL: "${VITE_MCP_BASE_URL:-}"
        VITE_MCP_API_KEY: "${VITE_MCP_API_KEY:-}"
        VITE_COMMUNITY_URL: "${VITE_COMMUNITY_URL:-}"
    expose:
      - "8001"
    env_file:
      - ./.env
    environment:
      FRONTEND_DIST: /app/dist
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/linkedin_agent"
      REDIS_URL: "redis://redis:6379/0"
    # Lets the app reach the upchange-ml-platform service (published on the host
    # at :8443) via http://host.docker.internal:8443 on Linux hosts.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
    networks:
      - internal

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linkedin_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  certbot-conf:
  certbot-www:

networks:
  internal:
    driver: bridge
