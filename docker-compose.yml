services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_* are baked into the frontend bundle at build time (from the single .env).
        VITE_MCP_BASE_URL: "${VITE_MCP_BASE_URL:-}"
        VITE_MCP_API_KEY: "${VITE_MCP_API_KEY:-}"
        VITE_COMMUNITY_URL: "${VITE_COMMUNITY_URL:-}"
        VITE_STRIPE_PUBLISHABLE_KEY: "${VITE_STRIPE_PUBLISHABLE_KEY:-}"
        VITE_STRIPE_BUY_BUTTON_ID: "${VITE_STRIPE_BUY_BUTTON_ID:-}"
        VITE_PRICE_CURRENCY: "${VITE_PRICE_CURRENCY:-}"
        VITE_PRICE_MONTHLY: "${VITE_PRICE_MONTHLY:-}"
        VITE_PRICE_QUARTERLY: "${VITE_PRICE_QUARTERLY:-}"
        VITE_PRICE_ANNUAL: "${VITE_PRICE_ANNUAL:-}"
    ports:
      - "8001:8001"
    # Single source of env for both frontend (build args above) and backend (runtime).
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linkedin_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
